# OrbStack:  HOST_PORT=6001 docker compose up --build -d   ->  http://127.0.0.1:6001
# Do not change the 127.0.0.1 below: the studio has no sign-in, so it must stay on loopback.
name: diagram-studio

services:
  diagram-studio:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-6001}:6001"
    environment:
      PORT: "6001"
      STUDIO_BIND: 0.0.0.0
      STUDIO_ALLOW_HOST: ""
    volumes:
      - studio-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6001/api/health').then(r=>r.json()).then(j=>process.exit(j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  studio-data:
